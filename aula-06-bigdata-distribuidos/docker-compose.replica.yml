services:
  mongo1:
    image: mongo:7.0
    container_name: aula06-mongo1
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo2:
    image: mongo:7.0
    container_name: aula06-mongo2
    hostname: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db

  mongo3:
    image: mongo:7.0
    container_name: aula06-mongo3
    hostname: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db

  rs-init:
    image: mongo:7.0
    container_name: aula06-rs-init
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        sleep 10
        mongosh --host mongo1:27017 --eval '
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017", priority: 2 },
              { _id: 1, host: "mongo2:27017", priority: 1 },
              { _id: 2, host: "mongo3:27017", priority: 1 }
            ]
          })
        '
        echo "Replica set inicializado."

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
